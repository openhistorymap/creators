name: Validate data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Referential integrity of the CSVs
        run: python3 tools/validate.py
      - name: SQLite build must succeed
        run: python3 tools/build_sqlite.py
